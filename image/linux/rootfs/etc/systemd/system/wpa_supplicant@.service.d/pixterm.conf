#
# wpa_supplicant runs only while Wi-Fi is on: pixterm-helper writes its
# configuration to /run at boot (pixterm-boot.service) and when Wi-Fi is
# turned on, and removes it when Wi-Fi is turned off.
[Unit]
ConditionPathExists=/run/pixterm-wifi/wpa_supplicant.conf
After=pixterm-boot.service
