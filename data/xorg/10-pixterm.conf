# Xorg configuration for the pixterm appliance.

Section "ServerFlags"
	# No virtual consoles behind the terminal.
	Option "DontVTSwitch" "true"
	# Ctrl+Alt+Backspace is the emergency reset (see the xkb option below).
	Option "DontZap" "false"
EndSection

Section "OutputClass"
	Identifier "pixterm-vc4"
	MatchDriver "vc4"
	Driver "modesetting"
	Option "PrimaryGPU" "true"
	# Software rendering: glamor on the Pi 3's VC4 is not a win for
	# core X11 drawing. Revisit with benchmarks.
	Option "AccelMethod" "none"
	# Do not use the kernel's GAMMA_LUT/CTM colour management. On the Pi 3
	# (vc4 HVS), Xorg's atomic colour setup programs an output colour
	# matrix that turns HDMI black (SCALER_OLEDOFFS enabled), and it stays
	# loaded after Xorg exits. The legacy gamma path is unaffected.
	Option "UseGammaLUT" "false"
EndSection

# Default keyboard. pixtermd writes the configured layout, and the
# display size, to /run/pixterm/xorg-settings.conf, linked as
# 20-pixterm-settings.conf.
Section "InputClass"
	Identifier "pixterm-keyboard"
	MatchIsKeyboard "on"
	Option "XkbLayout" "us"
	Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
