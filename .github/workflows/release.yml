#
# A tag vVERSION makes a draft GitHub release: the image built by
# image.yml, its package list, checksums and release notes. Publishing the
# draft is left to a person.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, version and change log agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in CMakeLists.txt"
            exit 1
          fi
          grep -q "^== $version\$" CHANGELOG.adoc || {
            echo "CHANGELOG.adoc has no section \"== $version\""
            exit 1
          }

  image:
    needs: check
    uses: ./.github/workflows/image.yml

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixterm-arm64
          path: built

      - name: Release files
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
          RELEASE_SITE: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_REPO: ${{ github.repository }}
        run: image/linux/release.sh built

      - name: Release files dir
        id: dist
        run: echo "dir=$(echo built/release-*)" >> "$GITHUB_OUTPUT"

      # A signed record (Sigstore, through GitHub) of the workflow and commit
      # that built each file. "gh attestation verify" checks it; there is no
      # signing key to keep.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.dist.outputs.dir }}/SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          dir: ${{ steps.dist.outputs.dir }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "pixterm ${TAG#v}" --notes-file "$dir/RELEASE-NOTES.md" \
            "$dir"/*.img.xz "$dir"/*.img.sha256 "$dir"/*.img.packages "$dir/SHA256SUMS" \
            "$dir/pixterm-imager.json" "$dir/pixterm-icon.png"
